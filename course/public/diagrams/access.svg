<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 656" role="img" aria-labelledby="t d">
<title id="t">登录之后还要检查权限</title><desc id="d">检查登录用户、所在租户、对象和字段权限、具体记录的访问范围，以及实际执行用户。应用入口有访问要求时还需检查应用权限。</desc>
<rect width="380" height="656" rx="18" fill="#f4f8f5"/>
<g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#203e35">
<text x="24" y="36" font-size="22" font-weight="700">登录后还要检查什么</text><text x="24" y="64" font-size="17">按当前操作检查所需权限</text>
<g fill="#fff" stroke="#a8beb3"><rect x="24" y="86" width="332" height="70" rx="10"/><rect x="24" y="168" width="332" height="70" rx="10"/><rect x="24" y="250" width="332" height="70" rx="10"/><rect x="24" y="332" width="332" height="70" rx="10"/><rect x="24" y="414" width="332" height="70" rx="10"/><rect x="24" y="496" width="332" height="70" rx="10"/></g>
<g font-size="20" font-weight="600"><text x="42" y="114">登录成功</text><text x="42" y="196">正确的租户</text><text x="42" y="278">应用访问权限</text><text x="42" y="360">对象与字段权限</text><text x="42" y="442">这条记录的访问权限</text><text x="42" y="524">实际执行用户</text></g>
<g font-size="17"><text x="42" y="141">当前登录的是谁</text><text x="42" y="223">是否进入了练习租户</text><text x="42" y="305">应用入口要求时检查</text><text x="42" y="387">允许哪些操作和字段</text><text x="42" y="469">Owner、分享等访问规则</text><text x="42" y="551">谁真正执行数据调用</text></g>
<rect x="24" y="588" width="332" height="46" rx="10" fill="#e1f0e8" stroke="#43876a"/><text x="190" y="617" text-anchor="middle" font-size="18" font-weight="600">条件满足 → 可以操作</text></g></svg>
