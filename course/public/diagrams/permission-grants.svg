.tree-edge{fill:none;stroke:#6b8793;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tree-root{fill:#174c5a;stroke:none}.tree-branch{fill:#e8f3f6;stroke:#5b91a1}.tree-leaf{fill:#fff;stroke:#a6bdc6}
.tree-hue-backend .tree-branch{fill:#eaf6ef;stroke:#4d9771}.tree-hue-database .tree-branch{fill:#f2effb;stroke:#8b74b5}
.tree-hue-cloud .tree-branch{fill:#fff6e6;stroke:#bb9550}.tree-socket{fill:#fff;stroke:#6a96a3}
.tree-accent{stroke:#6a96a3}.tree-hue-root .tree-label,.tree-hue-root .tree-sublabel{fill:#fff}
</style>
