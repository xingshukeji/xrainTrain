.c-frontend{fill:#e8f5fa;stroke:#347d94}.c-backend{fill:#edf7f1;stroke:#43916d}
.c-database{fill:#f1edfa;stroke:#8065af}.c-security{fill:#fbeef1;stroke:#b7677a}
.c-external{fill:#f5f8fa;stroke:#8ca2ad}.c-cloud{fill:#fff6e4;stroke:#af8c3b}
.c-lane{fill:#f8fafb;stroke:#d6e2e7}.c-security-group{fill:#fff8f8;stroke:#e0bec8}
