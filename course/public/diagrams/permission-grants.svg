<svg viewBox="0 0 981 876" lang="zh-CN" aria-labelledby="archify-diagram-title archify-diagram-description" xmlns="http://www.w3.org/2000/svg" width="981" height="876" role="img">
  <title id="archify-diagram-title">02 · 同一个用户，可以有多条权限来源</title>
  <desc id="archify-diagram-description">同一个用户可有多条来源；最终是否有效，还要按启停、拒绝与有效期判断。；撤销一个角色后，其他来源仍可能提供同一项权限。</desc>
  <style>
svg{background:#ffffff;color:#183a43}
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.c-grid{fill:none;stroke:#edf2f4}.c-mask{fill:#ffffff}
.t-primary{fill:#183a43}.t-muted,.t-dim{fill:#536b73}.t-security{fill:#9f3350}
